  >
    <span class="self-center text-2xl font-semibold whitespace-nowrap">
      School
    </span>
    <button

      data-collapse-toggle="navbar-default"
      type="button"

    >
      <mat-icon

      ></mat-icon>
    </button>

      class="items-center justify-between w-full md:flex md:w-auto md:order-1"
      id="navbar-default"
    >
      <ul
        class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-white"
      >
        <li>
          <a
            routerLink="/"
            (click)="closeMenu()"
            [ngClass]="{
              'text-white bg-blue-700 md:text-blue-700 md:bg-transparent':
                isActiveRoute('/alumnos'),
            }"
            class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0"
            aria-current="page"
            >Alumnos</a
          >
        </li>
        <li>
          <a
            routerLink="/cursos"
            (click)="closeMenu()"
            [ngClass]="{
              'text-white bg-blue-700 md:text-blue-700 md:bg-transparent':
                isActiveRoute('/cursos'),
            }"
            class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0"
            aria-current="page"
            >Cursos</a
          >
        </li>
        <li>
          <a
            routerLink="/examenes"
            (click)="closeMenu()"
            [ngClass]="{
              'text-white bg-blue-700 md:text-blue-700 md:bg-transparent':
                isActiveRoute('/examenes'),
            }"
            class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0"
            aria-current="page"
            >Examenes</a

        </li>
      </ul>
    </div>
